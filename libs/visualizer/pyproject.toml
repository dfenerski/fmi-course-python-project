[project]
name = "visualizer"
version = "0.1.0"
description = "Chart builder service"
readme = "README.md"
authors = [
    { name = "DF" }
]
requires-python = ">=3.12"
dependencies = [
    "common-util",
    "matplotlib>=3.10.0",
    "pandas>=2.2.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
common-util = { workspace = true }
